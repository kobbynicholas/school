<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241038"><title>Administrator Login | Hilltop International British School</title>
<style>
:root{--deep:#1d0d2e;--purple:#502478;--gold:#f0c45b;--ink:#251b31;--muted:#756a80}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#221033,#4e2670)}.card{width:min(460px,100%);background:#fff;border-radius:24px;padding:clamp(25px,6vw,42px);box-shadow:0 24px 70px #10051e55}.mark{width:49px;height:49px;display:grid;place-items:center;border-radius:15px;background:var(--deep);color:var(--gold);font-weight:900;margin-bottom:24px}h1{font-size:1.9rem;letter-spacing:-.05em;margin:0 0 9px;color:var(--deep)}p{line-height:1.6;color:var(--muted)}label{display:block;margin:23px 0 8px;font-weight:750;font-size:.88rem}input{width:100%;min-height:52px;padding:13px 15px;border:1px solid #d9cde5;border-radius:12px;font:inherit}button{margin-top:17px;width:100%;min-height:52px;border:0;border-radius:12px;background:linear-gradient(135deg,#55277c,#2b1244);color:#fff;font:inherit;font-weight:800;cursor:pointer}.message{display:none;margin-top:15px;border-radius:10px;padding:12px;font-size:.86rem}.message.show{display:block}.error{color:#942f39;background:#fff0f1}a{color:var(--purple)}footer{margin-top:23px;font-size:.8rem}
</style></head><body><main class="card"><div class="mark">HIBS · ADMIN</div><h1>Administrator access</h1><p>This area controls the class list, academic year and term. Use the separate administrator code; the shared teacher code will not unlock these settings.</p><form method="post" action="/__auth/admin-login"><input type="hidden" name="next" id="next" value="/admin-settings.html"><label for="password">Administrator access code</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="Enter administrator code"><button type="submit">Unlock administrator settings</button></form><div id="message" class="message" role="alert"></div><footer><a href="/login.html">Return to teacher login</a></footer></main><script>
(()=>{const q=new URLSearchParams(location.search),el=document.getElementById('message');let next=q.get('next')||'/admin-settings.html';if(!next.startsWith('/')||next.startsWith('//')||next==='/admin-login.html')next='/admin-settings.html';document.getElementById('next').value=next;if(q.get('error')==='1'){el.textContent='Administrator code not accepted.';el.className='message show error'}else if(q.get('setup')==='1'){el.textContent='Administrator authentication is not configured. Add the encrypted Cloudflare secrets.';el.className='message show error'}})();
</script></body></html>
